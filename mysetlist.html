<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>マイセトリ | 南條愛乃セトリアーカイブ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaisei+Decol&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="border-b border-[var(--line)]">
  <div class="max-w-5xl mx-auto px-4 py-5 flex items-center justify-between">
    <a href="index.html" class="font-display text-xl md:text-2xl">南條愛乃セトリアーカイブ</a>
    <div id="auth-nav" class="flex items-center gap-3"></div>
  </div>
</header>

<main class="max-w-3xl mx-auto px-4 py-10 space-y-8">
  <a href="mypage.html" class="link-quiet text-sm">← マイページに戻る</a>

  <div id="guest-notice" class="hidden garden-card p-6 text-sm text-[var(--muted)]">
    マイセトリを作るにはログインしてください。
  </div>

  <div id="mysetlist-content" class="hidden space-y-8">
    <section class="garden-card p-5">
      <h2 class="font-display text-lg mb-3">新しいマイセトリを作る</h2>
      <form id="create-form" class="flex gap-2">
        <input id="new-setlist-name" type="text" required placeholder="セトリの名前（例: 泣ける曲だけ）"
          class="flex-1 border border-[var(--line)] rounded-full px-4 py-2 text-sm" />
        <button type="submit" class="btn-garden text-xs">作成</button>
      </form>
    </section>

    <section id="setlist-container" class="space-y-6"></section>
  </div>
</main>

<script src="js/supabase-config.js"></script>
<script src="js/common.js"></script>
<script src="js/mysetlist.js"></script>
</body>
</html>
