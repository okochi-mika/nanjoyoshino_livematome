<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>プレイヤー | 南條愛乃セトリアーカイブ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaisei+Decol&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="border-b border-[var(--line)]">
  <div class="max-w-5xl mx-auto px-4 py-5 flex items-center justify-between">
    <a href="index.html" class="font-display text-xl md:text-2xl">南條愛乃セトリアーカイブ</a>
    <div id="auth-nav" class="flex items-center gap-3"></div>
  </div>
</header>

<main class="max-w-4xl mx-auto px-4 py-8">
  <a href="#" id="back-link" class="link-quiet text-sm">← ツアーに戻る</a>

  <div id="playlist-header" class="my-4">
    <p class="text-sm text-[var(--muted)]">読み込み中…</p>
  </div>

  <div class="grid md:grid-cols-5 gap-6">
    <div class="md:col-span-3">
      <div class="aspect-video w-full rounded-2xl overflow-hidden bg-black">
        <div id="yt-player" class="w-full h-full"></div>
      </div>
      <div class="flex items-center gap-2 mt-4">
        <button id="shuffle-btn" class="btn-outline text-xs">🔀 ランダム再生</button>
        <button id="next-btn" class="btn-outline text-xs">次の曲へ ▶</button>
      </div>
    </div>

    <div class="md:col-span-2">
      <div class="garden-card p-3 max-h-[520px] overflow-y-auto" id="track-list"></div>
    </div>
  </div>
</main>

<script src="js/supabase-config.js"></script>
<script src="js/common.js"></script>
<script>
  // YouTube IFrame API を先に読み込む
  const ytScript = document.createElement("script");
  ytScript.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(ytScript);
</script>
<script src="js/player.js"></script>
</body>
</html>
