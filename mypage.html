<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>マイページ | 南條愛乃セトリアーカイブ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaisei+Decol&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="border-b border-[var(--line)]">
  <div class="max-w-5xl mx-auto px-4 py-5 flex items-center justify-between">
    <a href="index.html" class="font-display text-xl md:text-2xl">南條愛乃セトリアーカイブ</a>
    <div id="auth-nav" class="flex items-center gap-3"></div>
  </div>
</header>

<main class="max-w-3xl mx-auto px-4 py-10 space-y-10">
  <div id="guest-notice" class="hidden garden-card p-6 text-sm text-[var(--muted)]">
    マイページを見るにはログインしてください。
  </div>

  <div id="mypage-content" class="hidden space-y-10">
    <section>
      <h2 class="font-display text-lg mb-3">表示名</h2>
      <div class="garden-card p-5 flex items-center gap-3">
        <input id="display-name-input" type="text" class="flex-1 border border-[var(--line)] rounded-full px-4 py-2 text-sm" />
        <button id="save-name-btn" class="btn-garden text-xs">保存</button>
      </div>
    </section>

    <section>
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-display text-lg">参加した公演</h2>
        <a href="index.html" class="link-quiet text-xs">ツアー一覧へ</a>
      </div>
      <div id="attended-list" class="garden-card p-2 sm:p-4"></div>
    </section>

    <section>
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-display text-lg">お気に入りの曲</h2>
      </div>
      <div id="favorites-list" class="garden-card p-2 sm:p-4"></div>
    </section>

    <section>
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-display text-lg">マイセトリ</h2>
        <a href="mysetlist.html" class="btn-garden text-xs">マイセトリを管理する →</a>
      </div>
    </section>
  </div>
</main>

<script src="js/supabase-config.js"></script>
<script src="js/common.js"></script>
<script src="js/mypage.js"></script>
</body>
</html>
